- name: 🔧 Fix gradlew line endings
  run: sed -i 's/\r$//' ./gradlew && chmod +x ./gradlew        path: app/build/outputs/apk/standard/debug/

    - name: 📤 APK আপলোড করুন (Release)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apk-release
        path: app/build/outputs/apk/standard/release/

    - name: ✨ বিল্ড সফল হয়েছে
      if: success()
      run: echo "✅ APK বিল্ড সফলভাবে সম্পন্ন হয়েছে!"
